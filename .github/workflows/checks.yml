name: Check research artifacts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile published results and check package
        run: python src/check_artifacts.py
  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Exercise model comparison and link reporting on synthetic data
        run: python -m unittest discover -s tests
      - name: Smoke check research explorer
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file('app.py').run(timeout=60)
          assert not app.exception, list(app.exception)
          assert len(app.metric) >= 4
          PY
